<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FSI - French Solar Industry | Solusi PLTS Terpercaya</title>
<style>
:root{--blue:#173b82;--gold:#d2a51e;--ink:#1e293b;--muted:#64748b;--bg:#f8fafc}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg)}
.wrap{max-width:1120px;margin:auto;padding:0 20px}
nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e2e8f0}
.nav{height:72px;display:flex;align-items:center;justify-content:space-between}
.brand img{height:46px;width:auto}
.portfolio-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.portfolio-card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #e2e8f0}
.portfolio-img{height:210px;background:#e2e8f0}
.portfolio-img img{width:100%;height:100%;object-fit:cover}
.portfolio-body{padding:20px}
</style>
</head>
<body>

<nav><div class="wrap nav">
<div class="brand"><img src="logo.jpg" alt="Logo"></div>
</div></nav>

<section id="portofolio" style="padding:50px 0;">
  <div class="wrap">
    <div class="portfolio-grid">
      <!-- 1. Villa -->
      <div class="portfolio-card">
        <div class="portfolio-img"><img src="villa-bali.jpg" alt="Villa Bali"></div>
        <div class="portfolio-body"><h3>Luxury Villa - Seminyak, Bali</h3></div>
      </div>
      <!-- 2. Pabrik -->
      <div class="portfolio-card">
        <div class="portfolio-img"><img src="pabrik-cikarang.jpg" alt="Pabrik Cikarang"></div>
        <div class="portfolio-body"><h3>Kawasan Industri - Cikarang</h3></div>
      </div>
      <!-- 3. Jakarta South -->
      <div class="portfolio-card">
        <div class="portfolio-img"><img src="jakarta-south.jpg" alt="Residensi Jakarta"></div>
        <div class="portfolio-body"><h3>Residensi Modern - Jakarta South</h3></div>
      </div>
      <!-- 4. Kantor -->
      <div class="portfolio-card">
        <div class="portfolio-img"><img src="kantor-denpasar.jpg" alt="Kantor Denpasar"></div>
        <div class="portfolio-body"><h3>Gedung Perkantoran - Denpasar</h3></div>
      </div>
    </div>
  </div>
</section>

</body>
</html>
